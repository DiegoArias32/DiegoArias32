name: 📈 GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Main card: languages, activity, habits
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DiegoArias32
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, blade
          plugin_lines: yes

      # Isometric calendar: the 3D-looking commit heatmap
      - name: Generate metrics-isocalendar.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DiegoArias32
          filename: metrics-isocalendar.svg
          base: ""
          config_timezone: America/Bogota
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Habits: when and how you actually code
      - name: Generate metrics-habits.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DiegoArias32
          filename: metrics-habits.svg
          base: ""
          config_timezone: America/Bogota
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes
